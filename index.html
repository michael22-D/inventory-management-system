<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>

    <link rel="stylesheet" href="css/style.css">

 <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Inventory Management System</h1>

            <p class="subtitle">
                Small-Scale Business Inventory Control
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label>Username</label>
                    <input
                        id="username"
                        type="text"
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="footer-text">

              <p>
        © 2026 Inventory Management System
        <br>
        All Rights Reserved
    </p>
            </div>

        </div>

    </div>


    <script>
        document.getElementById("loginForm").addEventListener("submit", async event => {
            event.preventDefault();
            const button = event.target.querySelector("button");
            button.disabled = true;
            try {
                const tabId = crypto.randomUUID();
                const response = await fetch("api/index.php?action=login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value,
                        tabId
                    })
                });
                const responseText = await response.text();
                let result = {};
                try {
                    result = responseText ? JSON.parse(responseText) : {};
                } catch {
                    throw new Error("The PHP API did not return JSON. Open http://localhost/IMS/index.html with Apache running in XAMPP.");
                }
                if (!responseText) {
                    throw new Error("The PHP API returned an empty response. Open http://localhost/IMS/index.html with Apache running in XAMPP.");
                }
                if (!response.ok) throw new Error(result.error || "Login failed.");
                sessionStorage.setItem("ims_tab_id", tabId);
                window.location.href = "dashboard.html";
            } catch (error) {
                alert(error.message);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>

<footer class="footer">
    
</footer>
